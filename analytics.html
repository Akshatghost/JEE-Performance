{% extends "base.html" %}{% block content %}<div class="top"><div class="title"><h1>Analytics</h1><div class="muted">Consistency matters as much as the peak.</div></div></div><div id="stats" class="grid kpis"></div><div class="grid two section"><div class="card chart"><div class="muted">SCORE VS DIFFICULTY</div><canvas id="chart"></canvas></div><div class="card chart"><div class="muted">ACCURACY</div><canvas id="acc"></canvas></div></div>{% endblock %}{% block scripts %}<script>
async function load(){let d=await api('/api/analytics');stats.innerHTML=[['Average',d.average],['Median',d.median],['Best',d.best],['Worst',d.worst],['Std deviation',d.sd],['Consistency',d.consistency+'%']].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');new Chart(chart,{type:'scatter',data:{datasets:[{label:'Tests',data:d.tests.map(x=>({x:x.difficulty,y:x.score}))}]},options:{scales:{x:{title:{display:true,text:'Difficulty'}},y:{title:{display:true,text:'Score'}}}}});new Chart(acc,{type:'line',data:{labels:d.tests.map(x=>x.date),datasets:[{label:'Accuracy %',data:d.tests.map(x=>x.accuracy),tension:.25}]}})}load();
</script>{% endblock %}
