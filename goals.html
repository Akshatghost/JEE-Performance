{% extends "base.html" %}{% block content %}<div class="top"><div class="title"><h1>Goals</h1><div class="muted">Targets should change behavior, not decorate the dashboard.</div></div></div><div class="card"><form id="form" class="form"><div><label>Goal</label><input name="name" required placeholder="Target score"></div><div><label>Target</label><input name="target" type="number" required></div><div><label>Current</label><input name="current" type="number" value="0"></div><div><label>Unit</label><input name="unit" placeholder="marks / % / DPPs"></div><div><label>Deadline</label><input name="deadline" type="date"></div><div class="actions"><button>Add goal</button></div></form></div><div class="card section" id="goals"></div>{% endblock %}{% block scripts %}<script>
form.onsubmit=async e=>{e.preventDefault();await api('/api/goals','POST',Object.fromEntries(new FormData(form)));form.reset();load()};async function load(){let a=await api('/api/goals');goals.innerHTML=a.map(g=>`<div style="padding:15px 0;border-bottom:1px solid var(--line)"><b>${g.name}</b><div class="muted">${g.current}/${g.target} ${g.unit} · ${g.progress}%</div><div style="margin-top:9px;height:5px;background:var(--line);border-radius:9px"><div style="height:100%;width:${g.progress}%;background:var(--accent);border-radius:9px"></div></div></div>`).join('')||'<div class="empty">No goals yet.</div>'}load();
</script>{% endblock %}
