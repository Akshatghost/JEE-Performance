<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEE Performance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#0b0d10;--panel:#11151a;--panel2:#171c22;--text:#edf1f5;--muted:#8e98a5;--line:#252c34;--accent:#7dd3fc;--green:#86efac;--yellow:#fde68a;--red:#fca5a5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}
.layout{display:flex;min-height:100vh}.side{width:230px;border-right:1px solid var(--line);padding:22px 14px;position:fixed;height:100vh;background:#0c0f13}.brand{font-weight:800;font-size:18px;padding:10px 12px 24px}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:4px}.nav a{display:block;padding:10px 12px;color:var(--muted);border-radius:7px;margin:2px 0}.nav a:hover,.nav a.active{background:var(--panel2);color:var(--text)}.main{margin-left:230px;width:calc(100% - 230px);padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title h1{margin:0;font-size:25px}.muted{color:var(--muted)}button,.btn{background:var(--text);color:#0b0d10;border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.btn.secondary,button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(5,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:17px}.kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.kpi .value{font-size:24px;font-weight:750;margin-top:8px}.section{margin-top:14px}.two{grid-template-columns:2fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.chart{height:310px}.chart canvas{width:100%!important;height:100%!important}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.badge{padding:4px 7px;border:1px solid var(--line);border-radius:999px;font-size:11px}.high{color:var(--red)}.good{color:var(--green)}.medium{color:var(--yellow)}.insight{border-left:3px solid var(--accent);padding:12px 14px;background:var(--panel2);margin-bottom:8px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form .full{grid-column:1/-1}.form label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.form input,.form select,.form textarea{width:100%;padding:9px;background:#0b0f13;border:1px solid var(--line);border-radius:6px;color:var(--text)}.form textarea{min-height:80px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.two,.three{grid-template-columns:1fr}}@media(max-width:700px){.side{width:64px;padding:14px 7px}.brand{font-size:0}.brand:before{content:"J";font-size:20px}.brand small,.nav a span{display:none}.main{margin-left:64px;width:calc(100% - 64px);padding:18px}.kpis{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.top{align-items:flex-start}.title h1{font-size:20px}}
</style></head>
<body><div class="layout">
<aside class="side"><div class="brand">JEE PERFORMANCE<small>Personal analytics system</small></div>
<nav class="nav">
<a href="/" data-page="dashboard">▦ <span>Dashboard</span></a><a href="/tests" data-page="tests">◷ <span>Tests</span></a><a href="/dpp" data-page="dpp">✓ <span>DPPs</span></a><a href="/chapters" data-page="chapters">◫ <span>Chapters</span></a><a href="/mistakes" data-page="mistakes">! <span>Mistakes</span></a><a href="/revision" data-page="revision">↻ <span>Revision</span></a><a href="/analytics" data-page="analytics">⌁ <span>Analytics</span></a><a href="/review" data-page="review">◉ <span>Weekly Review</span></a><a href="/goals" data-page="goals">◎ <span>Goals</span></a><a href="/calendar" data-page="calendar">□ <span>Calendar</span></a><a href="/settings" data-page="settings">⚙ <span>Settings</span></a>
</nav></aside><main class="main">{% block content %}{% endblock %}</main></div>
<script src="/static/js/app.js"></script>{% block scripts %}{% endblock %}</body></html>
