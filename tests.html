{% extends "base.html" %}{% block content %}<div class="top"><div class="title"><h1>Tests</h1><div class="muted">Record every test. Analyze the trend, not one score.</div></div></div>
<div class="card"><form id="form" class="form">
<div><label>Test name</label><input name="name" required placeholder="AITS 03"></div><div><label>Date</label><input type="date" name="date" required></div><div><label>Type</label><select name="type"><option>JEE Main</option><option>JEE Advanced</option><option>AITS</option><option>Coaching test</option><option>Chapter test</option><option>Custom</option></select></div>
<div><label>Max marks</label><input type="number" name="max_marks" value="300"></div><div><label>Marks</label><input type="number" name="marks" required></div><div><label>Percentile</label><input type="number" step=".01" name="percentile"></div>
<div><label>Rank</label><input type="number" name="rank"></div><div><label>Duration (min)</label><input type="number" name="duration" value="180"></div><div><label>Difficulty 1–5</label><input type="number" name="difficulty" min="1" max="5" value="3"></div>
<div><label>Correct</label><input type="number" name="correct" value="0"></div><div><label>Incorrect</label><input type="number" name="incorrect" value="0"></div><div><label>Skipped</label><input type="number" name="skipped" value="0"></div>
<div class="full"><b>Subject breakdown</b></div>
<div><label>Physics marks / correct / wrong / skipped</label><input name="p" placeholder="30 / 8 / 4 / 8"></div><div><label>Chemistry</label><input name="c" placeholder="35 / 10 / 3 / 7"></div><div><label>Mathematics</label><input name="m" placeholder="20 / 5 / 4 / 11"></div>
<div class="full actions"><button>Save test</button></div></form></div>
<div class="card section"><div class="muted">TEST HISTORY</div><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Name</th><th>Type</th><th>Score</th><th>Accuracy</th><th>Difficulty</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>{% endblock %}{% block scripts %}<script>
function parseSub(v){let a=v.split('/').map(x=>parseInt(x.trim())||0);return {marks:a[0]||0,correct:a[1]||0,incorrect:a[2]||0,skipped:a[3]||0}}
document.querySelector('[name=date]').value=new Date().toISOString().slice(0,10);
form.onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(form));x.subjects={Physics:parseSub(x.p||''),Chemistry:parseSub(x.c||''),Mathematics:parseSub(x.m||'')};await api('/api/tests','POST',x);form.reset();document.querySelector('[name=date]').value=new Date().toISOString().slice(0,10);load()};
async function load(){let a=await api('/api/tests');window._tests=a;rows.innerHTML=a.map(t=>`<tr><td>${t.date}</td><td>${t.name}</td><td>${t.type}</td><td><b>${t.marks}/${t.max_marks}</b></td><td>${t.accuracy}%</td><td>${t.difficulty}/5</td><td><button class="secondary" onclick="editTest('${t.id}')">Edit</button> <button class="secondary" onclick="deleteTest('${t.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No tests yet.</td></tr>'}load();
function editTest(id){const t=window._tests.find(x=>x.id===id);if(!t)return;const vals={name:t.name,date:t.date,type:t.type,max_marks:t.max_marks,marks:t.marks,percentile:t.percentile??'',rank:t.rank??'',difficulty:t.difficulty,correct:t.correct,incorrect:t.incorrect,skipped:t.skipped};Object.entries(vals).forEach(([k,v])=>{if(form.elements[k])form.elements[k].value=v});for(const s of t.subjects){const key=s.subject==='Physics'?'p':s.subject==='Chemistry'?'c':'m';form.elements[key].value=`${s.marks}/${s.correct}/${s.incorrect}/${s.skipped}`}window.scrollTo({top:0,behavior:'smooth'})}
async function deleteTest(id){if(confirm('Delete this test?')){await api('/api/tests/'+id,'DELETE');load()}}
</script>{% endblock %}
