{% extends "base.html" %}{% block content %}<div class="top"><div class="title"><h1>Revision Queue</h1><div class="muted">Priority = time since revision + demonstrated weakness.</div></div></div><div class="card"><form id="form" class="form"><div><label>Date</label><input name="date" type="date" required></div><div><label>Subject</label><select name="subject"><option>Physics</option><option>Chemistry</option><option>Mathematics</option></select></div><div><label>Chapter</label><input name="chapter" required></div><div class="full"><label>Notes</label><textarea name="notes"></textarea></div><div class="full actions"><button>Log revision</button></div></form></div><div class="card section"><div id="queue"></div></div>{% endblock %}{% block scripts %}<script>
form.date.value=new Date().toISOString().slice(0,10);form.onsubmit=async e=>{e.preventDefault();await api('/api/revision','POST',Object.fromEntries(new FormData(form)));form.reset();form.date.value=new Date().toISOString().slice(0,10);load()};async function load(){let a=await api('/api/dashboard');queue.innerHTML=a.revision.sort((x,y)=>y.days-x.days).map(x=>`<div class="insight ${x.days>14?'high':x.days>7?'medium':'good'}"><b>${x.chapter}</b><div class="muted">${x.subject} · ${x.days===999?'Never revised':x.days+' days since revision'} · accuracy ${x.accuracy}%</div></div>`).join('')||'<div class="empty">Complete chapters will appear here.</div>'}load();
</script>{% endblock %}
