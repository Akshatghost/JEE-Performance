{% extends "base.html" %}{% block content %}<div class="top"><div class="title"><h1>Weekly Review</h1><div class="muted">A short operational review, not a vanity report.</div></div></div><div class="card" id="review"></div>{% endblock %}{% block scripts %}<script>
async function load(){let d=await api('/api/dashboard');let t=d.tests.slice(-7),prev=d.tests.slice(-14,-7);let avg=a=>a.length?a.reduce((x,y)=>x+y.marks,0)/a.length:0;review.innerHTML=`<div class="grid three"><div><div class="muted">TESTS</div><h2>${t.length}</h2></div><div><div class="muted">AVG SCORE</div><h2>${avg(t).toFixed(1)}</h2></div><div><div class="muted">QUESTIONS</div><h2>${d.kpis.questions}</h2></div></div><hr style="border-color:var(--line);margin:22px 0"><h3>Compared with previous period</h3><p class="muted">Average score: ${avg(t).toFixed(1)} vs ${avg(prev).toFixed(1)}. ${avg(t)>=avg(prev)?'Direction is positive.':'Performance has regressed — inspect the latest mistakes before adding more volume.'}</p><h3>Biggest bottleneck</h3><div class="insight">${d.diagnosis[0].title}<br><span class="muted">${d.diagnosis[0].text}</span></div><h3>Recommended focus</h3><p class="muted">Prioritize the highest-weakness chapters and overdue revision before chasing more test volume.</p>`}load();
</script>{% endblock %}
