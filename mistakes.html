{% extends "base.html" %}{% block content %}<div class="top"><div class="title"><h1>Mistake Tracker</h1><div class="muted">Separate knowledge gaps from execution failures.</div></div></div><div class="card"><form id="form" class="form"><div><label>Date</label><input name="date" type="date" required></div><div><label>Source</label><input name="source" placeholder="AITS 03"></div><div><label>Subject</label><select name="subject"><option>Physics</option><option>Chemistry</option><option>Mathematics</option></select></div><div><label>Chapter</label><input name="chapter"></div><div><label>Mistake type</label><select name="type"><option>Conceptual</option><option>Calculation</option><option>Silly mistake</option><option>Misread question</option><option>Formula forgotten</option><option>Time pressure</option><option>Guessing</option><option>Didn't know</option><option>Wrong approach</option><option>Memory/revision failure</option></select></div><div><label>Difficulty</label><input name="difficulty" type="number" value="3" min="1" max="5"></div><div class="full"><label>Question / explanation</label><textarea name="question"></textarea></div><div class="full"><label>Correct approach</label><textarea name="approach"></textarea></div><div class="full actions"><button>Log mistake</button></div></form></div><div class="card section"><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Subject</th><th>Chapter</th><th>Type</th><th>Source</th></tr></thead><tbody id="rows"></tbody></table></div></div>{% endblock %}{% block scripts %}<script>
form.date.value=new Date().toISOString().slice(0,10);form.onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(form));x.explanation=x.question;x.approach=x.approach;await api('/api/mistakes','POST',x);form.reset();form.date.value=new Date().toISOString().slice(0,10);load()};async function load(){let a=await api('/api/mistakes');rows.innerHTML=a.map(m=>`<tr><td>${m.date}</td><td>${m.subject}</td><td>${m.chapter}</td><td>${m.type}</td><td>${m.source}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No mistakes logged.</td></tr>'}load();
</script>{% endblock %}
